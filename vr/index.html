<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>The Virtual City Experience · Immersive ELT Design Lab</title>
<link rel="stylesheet" href="../vendor/pannellum/pannellum.css">
<link rel="stylesheet" href="../css/site.css">
<style>
  html,body{overflow:hidden;background:#0c1322}
  #app{position:fixed;inset:0;display:flex;flex-direction:column}
  #bar{flex:0 0 auto}
  body.embed #bar .sub{display:none}
  #stage{position:relative;flex:1 1 auto;min-height:0}
  #pano{position:absolute;inset:0}
  .tabs{display:flex;gap:.4rem;margin-left:auto;flex-wrap:wrap}
  .tabs button{min-height:44px;padding:.35rem .8rem;border-radius:999px;border:2px solid #fff3;background:transparent;color:#fff;font-weight:700}
  .tabs button[aria-current="true"]{background:var(--amber);color:var(--navy);border-color:var(--amber)}
  .tabs .count{font-weight:600;opacity:.85;margin-left:.3rem;font-size:.85em}
  /* hotspots */
  .hs{width:46px;height:46px;border-radius:50%;border:3px solid #fff;box-shadow:0 2px 10px #0008;display:flex;align-items:center;justify-content:center;color:#fff;cursor:pointer;margin:-23px 0 0 -23px}
  .hs svg{width:24px;height:24px;pointer-events:none}
  .hs.hs-listen{background:#1f7a6d}.hs.hs-look{background:#2b6cb0}.hs.hs-language{background:#7b4fb3}.hs.hs-decide{background:#c2452d}.hs.hs-lens{background:#17233c;border-color:var(--amber)}.hs.hs-go{background:#5b6b88}
  .hs.done{box-shadow:0 0 0 4px #7bd88f, 0 2px 10px #0008}
  .hs.current:after{content:"";position:absolute;inset:-9px;border-radius:50%;border:3px solid var(--amber);animation:pulse 1.8s ease-out infinite}
  .hs.locked{background:#3a4358 !important;border-color:#aab3c5;color:#cfd6e4;opacity:.92}
  .hs .num{position:absolute;top:-10px;right:-10px;min-width:24px;height:24px;border-radius:12px;background:#fff;color:var(--navy);font-size:.82rem;font-weight:900;line-height:24px;text-align:center;box-shadow:0 1px 4px #0008;padding:0 4px}
  .hs.current .num{background:var(--amber)}
  .hs.done .num{background:#7bd88f}
  #toast{position:absolute;left:50%;bottom:74px;transform:translateX(-50%);z-index:26;max-width:min(560px,calc(100% - 24px));background:var(--amber);color:var(--navy);font-weight:800;border-radius:12px;padding:.6rem 1rem;box-shadow:0 4px 18px #0007;display:none;text-align:center}
  #toast.show{display:block}
  .tabs button[aria-disabled="true"]{opacity:.55}
  #guide button[aria-disabled="true"]{opacity:.55}
  #guide .n{flex:0 0 26px;height:26px;border-radius:13px;background:#fff;color:var(--navy);font-weight:900;font-size:.82rem;line-height:26px;text-align:center}
  #guide .n.cur{background:var(--amber)}
  #guide .n.ok{background:#7bd88f}
  .hs span.tip{position:absolute;bottom:56px;left:50%;transform:translateX(-50%);background:#0c1322ee;color:#fff;font-size:.82rem;font-weight:700;padding:.3rem .6rem;border-radius:6px;white-space:nowrap;visibility:hidden}
  .hs:hover span.tip,.hs:focus-visible span.tip{visibility:visible}
  @keyframes pulse{0%{transform:scale(.8);opacity:.9}100%{transform:scale(1.5);opacity:0}}
  /* panel */
  #panel{position:absolute;top:0;right:0;bottom:0;width:min(420px,100%);background:var(--paper);box-shadow:-6px 0 24px #0006;transform:translateX(105%);transition:transform .25s;overflow:auto;padding:1rem 1.1rem 5rem;z-index:20}
  #panel.open{transform:none}
  #panel .close{position:sticky;top:0;float:right;min-width:44px;min-height:44px;border-radius:50%;border:0;background:var(--navy);color:#fff;font-size:1.2rem;font-weight:800}
  @media(max-width:700px){#panel{top:auto;height:62%;width:100%;border-radius:18px 18px 0 0;transform:translateY(105%)}#panel.open{transform:none}}
  /* guide */
  #guideBtn{position:absolute;left:12px;bottom:12px;z-index:15}
  #guide{position:absolute;left:12px;bottom:66px;z-index:15;width:min(330px,calc(100% - 24px));max-height:60%;overflow:auto;background:#0c1322f2;color:#fff;border-radius:14px;padding:.6rem;display:none}
  #guide.open{display:block}
  #guide h2{font-size:.8rem;letter-spacing:.08em;text-transform:uppercase;margin:.3rem .4rem .5rem;color:var(--amber)}
  #guide p{font-size:.85rem;margin:.2rem .4rem .6rem;opacity:.9}
  #guide button{display:flex;gap:.5rem;align-items:center;width:100%;text-align:left;min-height:44px;background:transparent;border:0;color:#fff;border-radius:8px;padding:.3rem .4rem}
  #guide button:hover,#guide button:focus-visible{background:#ffffff1f}
  #guide .tick{margin-left:auto;color:#7bd88f;font-weight:900}
  #status{position:absolute;right:12px;bottom:12px;z-index:15;background:#0c1322e6;color:#fff;border-radius:999px;padding:.45rem .9rem;font-size:.88rem;font-weight:700}
  #loader{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#0c1322;color:#fff;z-index:30;text-align:center;padding:1rem}
  #loader.hide{display:none}
  #done{position:absolute;left:50%;top:14px;transform:translateX(-50%);z-index:25;width:min(520px,calc(100% - 24px));display:none}
  #done.show{display:block}
  .pnlm-about-msg{display:none !important}
</style>
</head>
<body>
<div id="app">
  <header class="topbar" id="bar">
    <div>
      <h1>The Virtual City Experience</h1>
      <div class="sub">Lindenbrück · drag to look around · follow the numbered steps in order: 1, 2, 3…</div>
    </div>
    <nav class="tabs" id="tabs" aria-label="Scenes"></nav>
  </header>
  <main id="stage">
    <div id="pano" aria-label="360 degree scene. Use the Guide button for a keyboard and screen-reader friendly list of points."></div>
    <div id="loader" role="status"><p><strong>Loading the scene…</strong></p><p class="small" style="color:#cbd5e8">Trouble loading? <a style="color:#ffd166" href="../alt/vr.html">Open the static version</a></p></div>
    <div id="done"></div>
    <button class="btn" id="guideBtn" aria-expanded="false" aria-controls="guide">Guide</button>
    <nav id="guide" aria-label="Points in this scene"></nav>
    <div id="status" role="status" aria-live="polite"></div>
    <div id="toast" role="alert"></div>
    <aside id="panel" aria-label="Point details" aria-live="polite"></aside>
  </main>
</div>
<script src="../config.js"></script>
<script src="../content/city.js"></script>
<script src="../js/common.js"></script>
<script src="../vendor/pannellum/pannellum.js"></script>
<script>
(function () {
  "use strict";
  var I = window.IELT, el = I.el, CITY = window.CITY;
  if (I.qs("embed") === "1") document.body.classList.add("embed");
  var ICON = {
    listen: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 14v-2a8 8 0 0 1 16 0v2"/><rect x="2.5" y="14" width="5" height="7" rx="2"/><rect x="16.5" y="14" width="5" height="7" rx="2"/></svg>',
    look: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>',
    language: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a8 8 0 0 1-11.6 7.1L3 21l1.9-6.4A8 8 0 1 1 21 12z"/><path d="M8.5 10h7M8.5 14h4.5"/></svg>',
    decide: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21v-8"/><path d="M12 13 5 6M12 13l7-7"/><path d="M5 10V6h4M19 10V6h-4"/></svg>',
    lens: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 9l10-5 10 5-10 5z"/><path d="M6 11.5V16c0 1.5 2.7 3 6 3s6-1.5 6-3v-4.5"/><path d="M22 9v6"/></svg>',
    go: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>'
  };
  var lite = I.qs("lite") === "1";
  try {
    var conn = navigator.connection || {};
    if (conn.saveData || /(^|-)(2g|3g)$/.test(conn.effectiveType || "")) lite = true;
    var gl = document.createElement("canvas").getContext("webgl");
    if (gl && gl.getParameter(gl.MAX_TEXTURE_SIZE) < 3840) lite = true;
  } catch (e) {}

  var opened = I.store("ielt_vr_opened") || {};   // hotspotId -> true
  var byId = {}, sceneOf = {}, nodes = {}, sceneSteps = {};
  CITY.scenes.forEach(function (s) {
    var k = 0; sceneSteps[s.id] = [];
    s.hotspots.forEach(function (h) { byId[h.id] = h; sceneOf[h.id] = s.id; if (h.type !== "go") { k++; h.step = k; sceneSteps[s.id].push(h.id); } });
  });
  var REQ = (CITY.vrCompletion && CITY.vrCompletion.requiredPerScene) || null;   // null = every numbered step
  var panel = document.getElementById("panel"), guide = document.getElementById("guide"), guideBtn = document.getElementById("guideBtn"), toastEl = document.getElementById("toast");
  var lastFocus = null, viewer = null, current = null, announcedDone = false, toastTimer = null;
  var calm = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;

  /* ---- sequence rules: steps are done in order inside a scene; a scene opens when the scenes before it are finished */
  function sceneIndex(sid) { for (var i = 0; i < CITY.scenes.length; i++) if (CITY.scenes[i].id === sid) return i; return -1; }
  function requiredIds(sid) { var a = sceneSteps[sid]; return REQ ? a.slice(0, REQ) : a; }
  function sceneDone(sid) { return requiredIds(sid).every(function (id) { return opened[id]; }); }
  function sceneUnlocked(sid) { var i = sceneIndex(sid); for (var j = 0; j < i; j++) if (!sceneDone(CITY.scenes[j].id)) return false; return true; }
  function nextStep(sid) { var a = sceneSteps[sid]; for (var j = 0; j < a.length; j++) if (!opened[a[j]]) return byId[a[j]]; return null; }
  function stepUnlocked(h) {
    var sid = sceneOf[h.id]; if (!sceneUnlocked(sid)) return false;
    var a = sceneSteps[sid], idx = a.indexOf(h.id);
    for (var j = 0; j < idx; j++) if (!opened[a[j]]) return false;
    return true;
  }
  function toast(msg) {
    toastEl.textContent = msg; toastEl.classList.add("show");
    clearTimeout(toastTimer); toastTimer = setTimeout(function () { toastEl.classList.remove("show"); }, 4200);
  }
  function lockedMessage(sid) {
    for (var j = 0; j < CITY.scenes.length; j++) {
      var s = CITY.scenes[j];
      if (!sceneDone(s.id)) { var n = nextStep(s.id); return "Scene " + s.letter + " (" + s.short + ") comes first. Next there: step " + n.step + ", " + n.title + "."; }
      if (s.id === sid) break;
    }
    return "";
  }

  function tooltip(div, h) {
    div.classList.add("hs", "hs-" + h.type);
    div.setAttribute("role", "button"); div.setAttribute("tabindex", "0");
    div.innerHTML = ICON[h.type] + (h.step ? '<span class="num"></span>' : "") + '<span class="tip"></span>';
    if (h.step) div.querySelector(".num").textContent = String(h.step);
    div.querySelector(".tip").textContent = (h.step ? h.step + ". " : "") + h.title;
    div.addEventListener("keydown", function (e) { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); activate(h, div); } });
    nodes[h.id] = div; paintOne(h);
  }
  function paintOne(h) {
    var n = nodes[h.id]; if (!n) return;
    var locked = h.type === "go" ? !sceneUnlocked(h.to) : !stepUnlocked(h);
    var cur = h.type === "go" ? (!locked && sceneDone(sceneOf[h.id]) && sceneIndex(h.to) > sceneIndex(sceneOf[h.id])) : (!locked && !opened[h.id]);
    n.classList.toggle("locked", locked); n.classList.toggle("done", !!opened[h.id]); n.classList.toggle("current", cur);
    n.setAttribute("aria-disabled", locked ? "true" : "false");
    n.setAttribute("aria-label", (h.step ? "Step " + h.step + ", " : "") + I.TYPE_LABEL[h.type] + ": " + h.title + (locked ? " (locked: finish the earlier steps first)" : opened[h.id] ? " (done)" : ""));
  }
  function activate(h, node) {
    if (h.type === "go") {
      if (!sceneUnlocked(h.to)) { var n0 = nextStep(sceneOf[h.id]); toast(n0 ? "Finish this scene first. Next: step " + n0.step + ", " + n0.title + "." : lockedMessage(h.to)); return; }
      viewer.loadScene(h.to); return;
    }
    if (!stepUnlocked(h)) { var nx = nextStep(sceneOf[h.id]); toast("This is step " + h.step + ". Do step " + nx.step + " first: " + nx.title + "."); return; }
    lastFocus = node || nodes[h.id] || guideBtn;
    opened[h.id] = true; I.store("ielt_vr_opened", opened);
    var d = I.detail(h);
    panel.innerHTML = "";
    var close = el("button", { class: "close", "aria-label": "Close details", text: "×", onclick: closePanel });
    panel.appendChild(close);
    panel.appendChild(el("p", { class: "small", style: "margin:0 0 .3rem;font-weight:800", text: "Step " + h.step + " of " + sceneSteps[sceneOf[h.id]].length + " in this scene" }));
    panel.appendChild(d.node);
    panel.appendChild(el("p", null, [el("button", { class: "btn dark", type: "button", text: "Done: go to the next step", onclick: closePanel })]));
    panel.classList.add("open"); d.heading.focus();
    refresh();
  }
  function closePanel() {
    var a = panel.querySelector("audio"); if (a) a.pause();
    var was = panel.classList.contains("open");
    panel.classList.remove("open");
    if (!was) return;
    // guide the participant to what comes next
    var nx = nextStep(current), target = nx;
    if (!nx) { var sc = CITY.scenes[sceneIndex(current)]; target = sc.hotspots.filter(function (h) { return h.type === "go" && sceneIndex(h.to) > sceneIndex(current); })[0] || null; }
    if (target && viewer) { viewer.lookAt(target.pitch, target.yaw, viewer.getHfov(), calm ? 0 : 900); if (nodes[target.id]) nodes[target.id].focus({ preventScroll: true }); }
    else if (lastFocus && lastFocus.focus) lastFocus.focus();
  }
  document.addEventListener("keydown", function (e) { if (e.key === "Escape" && panel.classList.contains("open")) closePanel(); });

  function progress() {
    var done = 0, total = 0, scenes = [];
    CITY.scenes.forEach(function (s) {
      var req = requiredIds(s.id); total += req.length;
      req.forEach(function (id) { if (opened[id]) done++; });
      if (sceneDone(s.id)) scenes.push(s.id);
    });
    return { done: done, total: total, scenesDone: scenes, complete: scenes.length === CITY.scenes.length };
  }
  function refresh() {
    var p = progress();
    document.getElementById("status").textContent = p.complete ? "Tour complete" : ("Step " + Math.min(p.done + 1, p.total) + " of " + p.total);
    Object.keys(byId).forEach(function (id) { paintOne(byId[id]); });
    // tabs
    var tabs = document.getElementById("tabs"); tabs.innerHTML = "";
    CITY.scenes.forEach(function (s) {
      var all = sceneSteps[s.id].length, dn = sceneSteps[s.id].filter(function (id) { return opened[id]; }).length, un = sceneUnlocked(s.id);
      var b = el("button", { type: "button", "aria-current": s.id === current ? "true" : "false", "aria-disabled": un ? "false" : "true",
        "aria-label": "Scene " + s.letter + ", " + s.short + ", " + dn + " of " + all + " steps done" + (un ? "" : ", locked"),
        onclick: function () { if (!sceneUnlocked(s.id)) { toast(lockedMessage(s.id)); return; } if (s.id !== current) viewer.loadScene(s.id); } },
        [(un ? "" : "🔒 ") + s.letter + " · " + s.short, el("span", { class: "count", text: dn + "/" + all })]);
      tabs.appendChild(b);
    });
    // guide list
    var sc = CITY.scenes[sceneIndex(current)];
    guide.innerHTML = "";
    if (sc) {
      guide.appendChild(el("h2", { text: sc.title }));
      guide.appendChild(el("p", { text: sc.summary }));
      guide.appendChild(el("p", { text: "Do the steps in order. A step opens when the one before it is done." }));
      sc.hotspots.forEach(function (h) {
        var locked = h.type === "go" ? !sceneUnlocked(h.to) : !stepUnlocked(h), isCur = !locked && !opened[h.id] && h.type !== "go";
        guide.appendChild(el("button", { type: "button", "aria-disabled": locked ? "true" : "false", onclick: function () {
          if (!locked && h.type !== "go") viewer.lookAt(h.pitch, h.yaw, viewer.getHfov(), calm ? 0 : 700);
          activate(h, guideBtn);
        } }, [el("span", { class: "n" + (opened[h.id] ? " ok" : isCur ? " cur" : ""), text: h.step ? String(h.step) : "→" }),
              el("span", { class: "badge t-" + h.type, text: I.TYPE_LABEL[h.type] }), el("span", { text: h.title }),
              opened[h.id] ? el("span", { class: "tick", "aria-label": "done", text: "✓" }) : (locked ? el("span", { class: "tick", style: "color:#cfd6e4", "aria-label": "locked", text: "🔒" }) : null)]));
      });
    }
    I.report("vr", { mode: "vr", opened: Object.keys(opened), scenes: p.scenesDone, total: p.done, required: p.total, complete: p.complete });
    if (p.complete && !announcedDone) {
      announcedDone = true;
      var box = document.getElementById("done"); box.innerHTML = "";
      var cp = I.checkpointBox(I.config.checkpoints.vr, "Virtual City tour");
      cp.appendChild(el("br"));
      cp.appendChild(el("button", { class: "btn", style: "margin-top:.5rem", text: "Keep exploring", onclick: function () { box.classList.remove("show"); } }));
      box.appendChild(cp); box.classList.add("show");
    }
  }
  guideBtn.addEventListener("click", function () {
    var o = guide.classList.toggle("open"); guideBtn.setAttribute("aria-expanded", o ? "true" : "false");
  });

  // resume at the first scene that is not finished
  var first = CITY.scenes[0].id;
  for (var q = 0; q < CITY.scenes.length; q++) { first = CITY.scenes[q].id; if (!sceneDone(first)) break; }
  var cfg = { default: { firstScene: first, sceneFadeDuration: 700, autoLoad: true, showControls: true, keyboardZoom: true, mouseZoom: true, hfov: 100, minHfov: 50, maxHfov: 110, minPitch: -78, maxPitch: 78, strings: { loadingLabel: "Loading the scene…" } }, scenes: {} };
  CITY.scenes.forEach(function (s) {
    cfg.scenes[s.id] = { type: "equirectangular", title: "", panorama: lite ? s.imageLite : s.image, yaw: s.yaw, pitch: s.pitch,
      hotSpots: s.hotspots.map(function (h) {
        return { pitch: h.pitch, yaw: h.yaw, cssClass: "hs-wrap", createTooltipFunc: tooltip, createTooltipArgs: h, clickHandlerFunc: function (e, hh) { activate(hh, nodes[hh.id]); }, clickHandlerArgs: h };
      }) };
  });
  try {
    viewer = pannellum.viewer("pano", cfg);
    current = cfg.default.firstScene;
    viewer.on("load", function () { document.getElementById("loader").classList.add("hide"); refresh(); });
    viewer.on("scenechange", function (id) { current = id; panel.classList.remove("open"); refresh(); I.report("vr", { mode: "vr", event: "scene", scene: id }); });
    viewer.on("error", function (m) {
      var l = document.getElementById("loader"); l.classList.remove("hide");
      l.innerHTML = '<p><strong>The 360° scene could not be displayed on this device.</strong></p><p><a class="btn" href="../alt/vr.html">Open the static version</a></p>';
    });
    window.__ieltViewer = viewer; window.__ieltVr = { activate: activate, byId: byId, opened: opened, stepUnlocked: stepUnlocked, sceneUnlocked: sceneUnlocked };
  } catch (e) {
    document.getElementById("loader").innerHTML = '<p><strong>The 360° viewer is not supported by this browser.</strong></p><p><a class="btn" href="../alt/vr.html">Open the static version</a></p>';
  }
  refresh();
})();
</script>
</body>
</html>
